# Lægger site/ ud på GitHub Pages: https://kasperai-stack.github.io/Maki/
# Siden bruger stier fra roden ("/css/..."), så de får /Maki foran, fordi Pages ligger i en undermappe.
name: GitHub Pages

on:
  push:
    branches: [claude/dazzling-brahmagupta-2bnrwz, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Byg siden til Pages
        env:
          BASE: /Maki
          URL: https://kasperai-stack.github.io/Maki
        run: |
          cp -r site _site
          # Rodstier ("/css/...") peger på projektmappen på Pages
          find _site -name '*.html' -exec sed -i -E "s#(href|src|action)=\"/([^/])#\1=\"$BASE/\2#g" {} +
          sed -i "s#url(\"/#url(\"$BASE/#g" _site/css/*.css
          # Delingsbilledet skal have den fulde adresse, ellers viser LinkedIn det ikke
          sed -i "s#content=\"/assets/og-image.jpg\"#content=\"$URL/assets/og-image.jpg\"#" _site/index.html
          touch _site/.nojekyll
          # Ny version ved hvert push, så browseren ikke viser gammel CSS og JS fra sin cache
          V=${GITHUB_SHA::7}
          find _site -name '*.html' -exec sed -i -E "s#(/css/styles\.css|/css/dokument\.css|/js/main\.js)\"#\1?v=$V\"#g" {} +

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
